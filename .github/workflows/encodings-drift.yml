name: Encodings drift

# The tables in `reference/wire/official-encodings.md` are rendered from the
# official encodings package core embeds (`core_stdlib/packages/comline`):
# its `config.idp` and the profiles it declares. This fails when the page no
# longer matches what core says, so a profile that changes in core reaches
# the docs.
#
# Like the IDL drift check it needs no Rust build, only a source fetch, so it
# runs per-PR as well as weekly. Separate from the Docs workflow because that
# one gates the Pages deploy, and a fetch against another repo has no business
# being able to block a deploy.

on:
  schedule:
    # A profile changed in `core` never touches this repo, so a
    # push-triggered run would not see it. Weekly catches that side.
    - cron: '45 7 * * 1'
  pull_request:
    paths:
      - 'docs/docs/reference/wire/official-encodings.md'
      - 'scripts/sync-official-encodings.py'
      - '.github/workflows/encodings-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encodings-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encodings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Reads the package straight from `core` (default branch), stdlib only.
      - name: Check for drift
        # `shell: bash` for pipefail: the `if !` must see the checker's exit
        # status, not tee's.
        shell: bash
        run: |
          if ! python3 scripts/sync-official-encodings.py --check | tee drift.txt; then
            {
              echo '### Encodings drift'
              echo
              echo '```'
              cat drift.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat drift.txt >> "$GITHUB_STEP_SUMMARY"
