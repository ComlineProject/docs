name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual retrigger, no commit needed
  schedule:
    # Safety net: a push to `main` that never dispatches this workflow (a
    # dropped webhook/event — rare, but observed) would otherwise leave
    # Pages silently stale with no error anywhere. This rebuilds and
    # redeploys from `main` daily regardless, so staleness self-heals
    # within a day instead of needing someone to notice.
    #
    # It also refreshes the verification results rendered at build time (see
    # "Render the verification reports"): the runtime's nightly fuzz run
    # publishes around 03:30 UTC, so this picks it up the same morning.
    - cron: '0 6 * * *'
  # Lets another repository's workflow ask for a rebuild once it publishes a
  # report (`gh api repos/ComlineProject/docs/dispatches -f event_type=reports-published`,
  # with a token that may write to this repository).
  repository_dispatch:
    types: [reports-published]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: docs/poetry.lock

      - name: Install dependencies
        working-directory: docs
        run: poetry install

      # The runtimes' benchmark and fuzzing results change with every runtime
      # push and nightly run, so they're fetched now instead of committed;
      # the pages include what this writes (docs/_generated/, ignored). A
      # report that can't be fetched renders as "not published yet", so this
      # never fails the build; the timeout and continue-on-error are a
      # second guard.
      - name: Render the verification reports
        timeout-minutes: 2
        continue-on-error: true
        run: python3 scripts/sync-language-support.py --render-reports

      - name: Build site
        working-directory: docs
        run: poetry run zensical build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
