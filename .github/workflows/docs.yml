name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual retrigger, no commit needed
  schedule:
    # Safety net: a push to `main` that never dispatches this workflow (a
    # dropped webhook/event — rare, but observed) would otherwise leave
    # Pages silently stale with no error anywhere. This rebuilds and
    # redeploys from `main` daily regardless, so staleness self-heals
    # within a day instead of needing someone to notice.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: docs/poetry.lock

      - name: Install dependencies
        working-directory: docs
        run: poetry install

      - name: Build site
        working-directory: docs
        run: poetry run zensical build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
