name: Language support drift

# The Reference -> Languages pages are rendered from generation's
# `features.json`: what its conformance suite proves. This checks they're
# current. Like the IDL drift check it needs no Rust build, only a fetch,
# so it runs per pull request. It's kept separate from the Docs workflow,
# because a fetch from another repo shouldn't be able to block a deploy.

on:
  schedule:
    # A generator gaining a feature never touches this repo, so a
    # push-triggered run would not see it. Weekly catches that side.
    - cron: '45 7 * * 1'
  pull_request:
    paths:
      - 'docs/docs/reference/languages/**'
      - 'scripts/sync-language-support.py'
      - '.github/workflows/language-support-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-support-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check for drift
        shell: bash
        run: |
          if ! python3 scripts/sync-language-support.py --check | tee drift.txt; then
            {
              echo '### Language support drift'
              echo
              echo '```'
              cat drift.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
