name: Language support drift

# The Reference -> Languages pages are rendered from what the conformance
# suites prove: generation's `features.json`, and the runtime wire corpus
# with each runtime's report. This checks they're current. Like the IDL drift check it needs no Rust build, only a fetch,
# so it runs per pull request. It's kept separate from the Docs workflow,
# because a fetch from another repo shouldn't be able to block a deploy.

on:
  schedule:
    # A generator or runtime gaining a feature never touches this repo, so a
    # push-triggered run would not see it. Weekly catches that side.
    - cron: '45 7 * * 1'
  pull_request:
    paths:
      - 'docs/docs/reference/languages/**'
      - 'scripts/sync-language-support.py'
      - '.github/workflows/language-support-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; scheduled and
# manual runs queue.
concurrency:
  group: language-support-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.10

      - name: Check for drift
        shell: bash
        run: |
          if ! python3 scripts/sync-language-support.py --check | tee drift.txt; then
            {
              echo '### Language support drift'
              echo
              echo '```'
              cat drift.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
