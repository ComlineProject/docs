extra_css:
  - stylesheets/nav.css?v=23   # bump on every nav.css change — it is not cache-busted otherwise

theme:
  name: material
  logo: assets/comline-mark.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  # Dark first: the first entry is what a new visitor sees.
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: teal
      accent: lime

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: teal
      accent: purple


