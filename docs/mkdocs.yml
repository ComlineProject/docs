  - Getting started: 'getting-started.md'
  - Guide:
    - Overview: 'guide/overview.md'
    - 'IDL / Schema':
      - 'guide/idl/index.md'
      - Structures: 'guide/idl/structure.md'
      - Enums: 'guide/idl/enum.md'
      - Protocols: 'guide/idl/protocol.md'
      - Errors: 'guide/idl/error.md'
      - Validators: 'guide/idl/validator.md'
      - Constants: 'guide/idl/const.md'
      - Imports: 'guide/idl/use.md'
      - Docstrings: 'guide/idl/docstrings.md'
      - Settings: 'guide/idl/settings.md'
    - 'Intermediate Representation':
      - 'guide/ir/index.md'
      - Content-addressable storage: 'guide/ir/cas.md'
    - 'Code generation':
      - 'guide/codegen/index.md'
      - Generating code: 'guide/codegen/generating-code.md'
      - Runtime libraries: 'guide/codegen/runtime.md'
    - 'Runtime':
      - 'guide/runtime/index.md'
      - Call systems & serialization: 'guide/runtime/call-system.md'
    - 'Packages & dependencies': 'guide/packages/index.md'
  - Reference:
    - 'comline.toml': 'reference/comline-toml.md'
    - CLI: 'reference/cli.md'
    - Versioning rules: 'reference/versioning.md'
  - Design:
    - 'design/index.md'
    - Consumer generation configuration: 'design/consumer-generation-config.md'
    - Multi-version generation: 'design/multi-version-generation.md'
    - IR freezing & the version state: 'design/ir-generation.md'
    - Codegen by language: 'design/codegen-by-language.md'
    - Validators: 'design/validators.md'
  - Proposals:
    - 'proposals/index.md'
    - Automatic documentation: 'proposals/auto-documentation.md'
  - Resources: 'resources.md'


theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: teal
      accent: purple

    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: teal
      accent: lime


# TODO: The social plugin is disabled due to not Cairo lib not being available on Nix
#plugins:
#  - social

extra:
#  social:
#    - icon: fontawesome/brands/github-alt
#      link: https://github.com/james-willett
#    - icon: fontawesome/brands/twitter
#      link: https://twitter.com/TheJamesWillett
#    - icon: fontawesome/brands/linkedin
#      link: https://www.linkedin.com/in/willettjames/
  version:
    provider: mike
    default: stable

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


