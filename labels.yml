- name: wire
  color: bfdadc
  description: "Formats, framings, handshakes"
- name: compiler
  color: bfdadc
  description: "Parser, IR, CAS"
- name: config
  color: bfdadc
  description: "Packages, config.idp, settings"
- name: codegen
  color: bfdadc
  description: "Code generation"
- name: runtime
  color: bfdadc
  description: "Runtimes and the shared core"
- name: tooling
  color: bfdadc
  description: "CLI, language server, editor"
- name: playground
  color: bfdadc
  description: "Playground and simulator"
- name: stdlib
  color: bfdadc
  description: "Standard library"
- name: versioning
  color: bfdadc
  description: "Versions and compatibility"
- name: extensibility
  color: bfdadc
  description: "Third-party encodings and generators"
- name: testing
  color: bfdadc
  description: "Tests, fuzzing, conformance"
- name: diagnostics
  color: bfdadc
  description: "Errors and diagnostics"
- name: performance
  color: bfdadc
  description: "Speed and size"
- name: security
  color: bfdadc
  description: "Security and safety"

# GitHub defaults, kept
- name: duplicate
  color: cfd3d7
  description: "This issue or pull request already exists"
- name: invalid
  color: e4e669
  description: "This doesn't seem right"
- name: wontfix
  color: ffffff
  description: "This will not be worked on"
- name: good first issue
  color: 7057ff
  description: "Good for newcomers"
- name: help wanted
  color: 008672
  description: "Extra attention is needed"
